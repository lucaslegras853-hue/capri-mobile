name: Construire Capri Mobile

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Construire l'APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Capri.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Capri-Mobile-APK
          path: Capri.apk
      # Une « release » publique : le lien de téléchargement direct marche sans se connecter.
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Capri.apk --title "Capri Mobile (build ${{ github.run_number }})" --notes "Installe Capri.apk sur ton téléphone." --latest
